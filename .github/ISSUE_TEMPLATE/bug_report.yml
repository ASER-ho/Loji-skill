name: 工具缺陷报告
description: 脚本、校验器、记忆/判断 CLI 或 DSH 适配包报错或行为异常
title: "[工具] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        只用于本仓库自带的代码（`scripts/`、`loji-dsh/`、`tests/`）。
        外部宿主、模型服务、插件市场的缺陷不属于本仓库范围。
        **不要粘贴真实 `memory.md`、`JUDGMENTS.md` 或 `memory.state.json` 的内容**；用合成数据复现。

  - type: dropdown
    id: component
    attributes:
      label: 受影响组件
      options:
        - scripts/memory_io.py（记忆读写）
        - scripts/memory_state.py（授权状态）
        - scripts/judgment_ledger.py（判断账本）
        - scripts/migrate_memory.py / init_memory.py（初始化与迁移）
        - scripts/validate_repo.py（仓库校验）
        - scripts/check_docs_consistency.py（发布文档一致性）
        - scripts/eval_harness.py（评测入口）
        - loji-dsh 适配包 / preset 生成
        - 不适用
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: 执行的命令
      render: shell
      placeholder: python scripts/judgment_ledger.py --help
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: 报错输出
      description: 完整堆栈或错误行，不要只写「报错了」。
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 环境
      description: 操作系统 + Python 版本 + Node 版本（如涉及）。Windows 用户请注明 PowerShell 版本。
      placeholder: Windows 11 24H2 / Python 3.12.10 / Node 22.11
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 仓库版本
      placeholder: master @ 0a1b2c3（或 v1.1.4）
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已用合成数据复现，未附带真实记忆或判断账本内容
          required: true
        - label: 我已尝试在 `master` 最新提交上复现
          required: true

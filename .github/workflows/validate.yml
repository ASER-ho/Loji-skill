name: validate

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      # Windows runners default to a legacy ANSI code page, which turns any
      # script that prints Chinese into a UnicodeEncodeError traceback.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false
      matrix:
        include:
          # README supports Python 3.11+ and ships PowerShell install paths,
          # so both the lowest supported Python and Windows are exercised.
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Validate repository
        run: python scripts/validate_repo.py --strict

      - name: Check release documentation consistency
        run: python scripts/check_docs_consistency.py

      - name: Validate with official skills-ref
        shell: bash
        run: |
          # ROADMAP requires `skills-ref validate .`. When the tool cannot be
          # installed this step reports ENV-BLOCKED; the local structural
          # checks above are explicitly not counted as a skills-ref PASS.
          if python -m pip install --quiet "skills-ref==0.1.0" && command -v skills-ref >/dev/null 2>&1; then
            skills-ref validate .
            echo "skills-ref: PASS"
          else
            echo "::warning title=ENV-BLOCKED::skills-ref unavailable; not counted as skills-ref PASS"
          fi

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Set up Node.js for loji-dsh
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check DSH skill metadata
        run: npm run check:meta

      - name: Test loji-dsh adapter
        run: npm test

      - name: Check generated DSH preset
        run: npm run check:preset

      - name: Parse DSH preset with safe YAML tags
        run: |
          python -m pip install pyyaml
          python loji-dsh/scripts/validate_patch.py

      - name: Verify installable npm package contents
        shell: bash
        run: |
          # The archive name follows package.json, so it is resolved at run
          # time instead of being hard-coded to a release version.
          set -euo pipefail
          archive_dir="$(mktemp -d)"
          npm pack --silent --pack-destination "$archive_dir" >/dev/null
          archive="$(ls "$archive_dir"/loji-dsh-*.tgz | head -n 1)"
          echo "Packed archive: $archive"
          tar -xzf "$archive" -C "$archive_dir"
          node loji-dsh/scripts/verify-packed-bundle.mjs "$archive_dir/package"

name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository
        run: python scripts/validate_repo.py --strict

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Set up Node.js for loji-dsh
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check DSH skill metadata
        run: npm run check:meta

      - name: Test loji-dsh adapter
        run: npm test

      - name: Check generated DSH preset
        run: npm run check:preset

      - name: Parse DSH preset with safe YAML tags
        run: |
          python -m pip install pyyaml
          python loji-dsh/scripts/validate_patch.py
